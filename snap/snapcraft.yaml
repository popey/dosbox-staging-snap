name: dosbox-staging
version: 0.82.2
summary: Open Source PC/MS-DOS emulator
description: |
  DOSBox is a DOS-emulator that uses the SDL-library which 
  makes DOSBox very easy to port to different platforms. DOSBox has 
  already been ported to many different platforms, such as Windows, BeOS, 
  Linux, MacOS X...
  
  DOSBox also emulates CPU:286/386 realmode/protected mode, 
  Directory FileSystem/XMS/EMS, Tandy/Hercules/CGA/EGA/VGA/VESA graphics, 
  a SoundBlaster/Gravis Ultra Sound card for excellent sound compatibility 
  with older games...
  
  You can "re-live" the good old days with the help of DOSBox, it 
  can run plenty of the old classics that don't run on your new computer!  
  
  DOSBox is totally free of charge and OpenSource.

grade: stable
confinement: strict
base: core24

platforms:
  amd64:
  arm64:

apps:
  dosbox-staging:
    command: usr/local/bin/dosbox
    plugs: [audio-playback, home, audio-record, desktop, desktop-legacy, wayland, x11, opengl, removable-media, joystick, network, network-bind]
    extensions: [gnome]
    environment: 
      HOME: $SNAP_REAL_HOME

parts:
  fluidsynth:
    source: https://github.com/FluidSynth/fluidsynth.git
    plugin: cmake
    source-tag: "v2.5.3"
    organize:
      usr/local/lib64/lib*.so*: usr/lib/
  mt:
    source: https://github.com/munt/munt.git
    plugin: cmake
    source-subdir: "mt32emu"
    source-tag: "munt_2_7_0"
    organize:
      usr/local/lib/lib*.so*: usr/lib/
  dosbox-staging:
    after: [mt, fluidsynth]
    plugin: meson
    override-build: |
      # Build args: disable PIE globally (fixes dynrec on non-x86)
      MESON_ARGS="-Db_pie=false"
      # On arm64, also disable dynrec JIT: Asahi Linux enforces W^X which
      # blocks mmap(PROT_WRITE|PROT_EXEC) used by the JIT cache.
      # The interpreted core works fine and upstream doesn't support
      # arm64 Linux officially anyway.
      if [ "$CRAFT_ARCH_BUILD_FOR" = "arm64" ]; then
        MESON_ARGS="$MESON_ARGS -Ddynamic_core=none"
      fi
      meson setup $MESON_ARGS "$CRAFT_PART_BUILD" "$CRAFT_PART_SRC"
      ninja -C "$CRAFT_PART_BUILD"
      DESTDIR="$CRAFT_PART_INSTALL" ninja -C "$CRAFT_PART_BUILD" install
    source: https://github.com/dosbox-staging/dosbox-staging/archive/refs/tags/v$SNAPCRAFT_PROJECT_VERSION.tar.gz
    build-packages:
      - libsdl2-dev
      - libsdl2-image-dev
      - libopus-dev
      - libopusfile-dev
      - cmake
      - build-essential
      - libsdl2-net-dev
      - libslirp-dev
      - pkg-config
      - meson
      - libpng-dev
    stage-packages:
      - libsdl2-2.0-0
      - libsdl2-image-2.0-0
      - libslirp0
      - libslang2
      - libglu1-mesa
      - libopusfile0
      - libglut3.12
      - fluidsynth
      - libsdl2-net-2.0-0
    organize:
      usr/local/lib/*/lib*.so*: usr/lib/
      usr/local/lib/lib*.so*: usr/lib/
      usr/lib/*/libpulse.so.*: usr/lib/
      usr/lib/*/pulseaudio/libpulsecommon*: usr/lib/
    prime:
      - -share
      - -usr/share/doc
      - -usr/share/lintian
      - -usr/share/man
  cleanup:
    after: [fluidsynth, mt, dosbox-staging]
    plugin: nil
    build-snaps: [ gnome-46-2404 ]
    override-prime: |
      set -eux
      cd /snap/gnome-46-2404/current
      find . -type f,l -exec rm -f $CRAFT_PRIME/{} \;
