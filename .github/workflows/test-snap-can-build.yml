name: 🧪 Build and smoke test snap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      snap: ${{ steps.build.outputs.snap }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Show log on build failure
        if: failure()
        run: cat /home/runner/.local/state/snapcraft/log/snapcraft*.log

      - name: Review snap
        uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: 'false'

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7

  smoke-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@v4
        with:
          name: snap

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb scrot x11-utils snapd
          sudo systemctl start snapd
          sudo snap wait system seed.loaded

      - name: Install snap
        run: |
          SNAP_FILE=$(ls *.snap | head -1)
          echo "Installing $SNAP_FILE"
          sudo snap install --dangerous "$SNAP_FILE"

      - name: Connect interfaces
        run: |
          sudo snap connect dosbox-staging:audio-playback || true
          sudo snap connect dosbox-staging:joystick || true
          sudo snap connect dosbox-staging:opengl || true

      - name: Launch app and take screenshot
        run: |
          # Run under Xvfb - virtual framebuffer
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          export DISPLAY=:99

          # Launch dosbox-staging in the background; it will show the config prompt or main window
          # We pass -exit so it doesn't wait for user input (exits after running any -c commands)
          timeout 30 snap run dosbox-staging -c "exit" || true

          # Take a full screenshot of the virtual display
          scrot -d 1 screenshot-screen.png || import -window root screenshot-screen.png || true

          ls -lh screenshot-*.png || echo "No screenshots captured"

      - name: Upload screenshots as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: screenshot-*.png
          retention-days: 14

      - name: Comment screenshot on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const screenshots = fs.readdirSync('.').filter(f => f.endsWith('.png'));
            if (screenshots.length === 0) {
              console.log('No screenshots to post');
              return;
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🧪 Smoke test screenshots\n\nScreenshots captured after launching the snap. Full artifacts: [view run](${runUrl})\n\n> Note: Screenshots are attached as [workflow artifacts](${runUrl}) (download to view).`
            });
